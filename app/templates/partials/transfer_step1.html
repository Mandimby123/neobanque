<form hx-post="/transfers/step2" hx-target="#transfer-stepper" hx-swap="innerHTML" class="space-y-6 animate-fade-in">
    
    <!-- Stepper Indicator -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center space-x-2 text-brand-400 font-semibold text-xs uppercase tracking-wider">
            <span class="w-6 h-6 rounded-full bg-brand-500 text-slate-950 flex items-center justify-center font-bold text-xs">1</span>
            <span>Sélection des Comptes</span>
        </div>
        <div class="flex items-center space-x-3 text-xs text-slate-500">
            <span>Étape 1 / 3</span>
        </div>
    </div>

    <!-- Compte Émetteur (Source) -->
    <div>
        <label for="source_account_id" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Compte à débiter
        </label>
        <select 
            id="source_account_id" 
            name="source_account_id" 
            required
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            {% for acc in accounts %}
            <option value="{{ acc.id }}">
                {{ acc.name }} — Solde : {{ '%.2f'|format(acc.balance) }} € (IBAN : {{ format_iban(acc.iban)[:14] }}...)
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Bénéficiaire (Destinataire) -->
    <div>
        <div class="flex items-center justify-between mb-2">
            <label for="beneficiary_id" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                Bénéficiaire créditeur
            </label>
            <button 
                type="button" 
                onclick="document.getElementById('add-beneficiary-modal').classList.remove('hidden')" 
                class="text-xs text-brand-400 hover:text-brand-300 flex items-center space-x-1 font-medium">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                <span>Nouveau bénéficiaire (RIB)</span>
            </button>
        </div>

        <select 
            id="beneficiary_id" 
            name="beneficiary_id" 
            required
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            {% for ben in beneficiaries %}
            <option value="{{ ben.id }}">
                {{ ben.name }} — {{ format_iban(ben.iban) }} (Clé RIB : {{ ben.rib_key }})
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Navigation Stepper -->
    <div class="pt-4 flex justify-end">
        <button 
            type="submit" 
            class="px-6 py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition-all shadow-lg shadow-brand-500/20 flex items-center space-x-2">
            <span>Étape suivante : Montant</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>

</form>
